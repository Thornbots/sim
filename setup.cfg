[tool:pytest]
testpaths = test
# -p no:anyio: the pip-installed anyio in the container ships a pytest
# plugin incompatible with the apt pytest 6.2.5 and breaks collection
# outright (ModuleNotFoundError: _pytest.scope).
# Integration GTest executables are invoked only by their launch files.
addopts = -p no:anyio
markers =
    linter: ament lint check (flake8/pep257/copyright)
    flake8: ament_flake8
    pep257: ament_pep257
    copyright: ament_copyright
