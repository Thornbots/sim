[develop]
script-dir=$base/lib/sim
[install]
install-scripts=$base/lib/sim

[tool:pytest]
testpaths = test
# -p no:anyio: the pip-installed anyio in the container ships a pytest
# plugin incompatible with the apt pytest 6.2.5 and breaks collection
# outright (ModuleNotFoundError: _pytest.scope).
# -m "not integration": keeps gz-sim out of a plain `colcon test`. Opt in
# with `colcon test --packages-select sim --pytest-args ' -m integration'`
# (the command line's -m wins over this one).
addopts = -p no:anyio -m "not integration"
markers =
    integration: launches gz-sim and the full sentry stack (opt-in)
